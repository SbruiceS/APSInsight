[project]
name = "apsinsight"
version = "0.1.0"
description = "APSInsight scientific processing and machine learning package"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=17.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
