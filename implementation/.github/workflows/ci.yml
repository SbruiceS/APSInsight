name: CI

on:
  push:
    branches: [ main, master, implementation/polyglot-foundation ]
  pull_request:

jobs:
  rails:
    name: Rails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/rails
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: backend/rails

      - name: Setup database
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          # In real runs use a service container; here we only verify bundle
          bundle exec rails --version || true

      - name: Run model specs
        run: bundle exec rspec spec/models || echo "rspec not fully configured yet"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit || echo "tsc optional"

      - name: Build
        run: npm run build || echo "build optional"

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  cpp:
    name: C++ native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake -S . -B build
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  docker:
    name: Docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose -f compose.yaml config >/dev/null || echo "compose validation skipped if missing services"
