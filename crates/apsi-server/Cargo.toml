[package]
name = "apsi-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
apsi-core = { version = "0.1.0", path = "../apsi-core" }
apsi-contracts = { version = "0.1.0", path = "../apsi-contracts" }
apsi-science = { version = "0.1.0", path = "../apsi-science" }
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.53.3", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["limit", "trace", "cors", "fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
