[package]
name = "apsi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hex = "0.4.3"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["serde", "formatting", "parsing", "macros"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
