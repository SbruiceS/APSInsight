[package]
name = "apsi-engine"
description = "APSI Compute Engine: typed, unit-checked workflow plans with an optimizer, cost model, parallel CPU/native/accelerator execution, and DataFusion SQL over Arrow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
apsi-core = { version = "0.1.0", path = "../apsi-core" }
apsi-contracts = { version = "0.1.0", path = "../apsi-contracts" }
apsi-native = { version = "0.1.0", path = "../apsi-native" }
apsi-science = { version = "0.1.0", path = "../apsi-science" }
datafusion = { version = "54.1.0", default-features = false, features = ["sql", "parquet", "math_expressions", "string_expressions", "datetime_expressions"] }
hex = "0.4.3"
parking_lot = "0.12.5"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["formatting"] }
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "time", "macros"] }

[lints]
workspace = true
