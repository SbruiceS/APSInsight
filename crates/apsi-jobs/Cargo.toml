[package]
name = "apsi-jobs"
description = "Deterministic, tenant-isolated job lifecycle primitives for APSInsight workers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["serde", "formatting", "parsing", "macros"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }

[lints]
workspace = true
