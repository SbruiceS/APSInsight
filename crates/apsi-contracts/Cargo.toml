[package]
name = "apsi-contracts"
description = "Versioned integration contracts for planned ASPF products (AgriQL, KutajKutambi AI, AgriCUDA, APSNetwork, Nityaga RTOS) and optional accelerators. No product implementation is included."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["parsing"] }

[lints]
workspace = true
