[package]
name = "apsi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "apsi"
path = "src/main.rs"

[dependencies]
apsi-core = { version = "0.1.0", path = "../apsi-core" }
apsi-contracts = { version = "0.1.0", path = "../apsi-contracts" }
apsi-science = { version = "0.1.0", path = "../apsi-science" }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = "1.0.229"
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
