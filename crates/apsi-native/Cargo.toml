[package]
name = "apsi-native"
description = "C++17 scientific kernels behind a narrow, versioned C ABI, with safe Rust wrappers and a pure-Rust reference implementation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
links = "apsi_kernels"
build = "build.rs"

[dependencies]

[build-dependencies]
cc = "1.2.40"

# This crate is the only place in the workspace allowed to use `unsafe`: it
# wraps the C ABI. It therefore does not inherit the workspace-wide
# `unsafe_code = "forbid"`, and sets every other lint at the workspace level.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
